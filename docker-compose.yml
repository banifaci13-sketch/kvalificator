# Квалификатор + Caddy (HTTPS-сертификат Let's Encrypt выпускается автоматически).
# Запуск: docker compose up -d --build   (настройки — в .env, см. deploy/install.sh)
services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-mirror.gcr.io/library/node:22-alpine}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DB_PATH: /app/data/kvalificator.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: ${CADDY_IMAGE:-mirror.gcr.io/library/caddy:2}
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
