<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо квалификатора</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #14213d; background: #f5f7fb; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: #5b6478; line-height: 1.6; }
    .cta { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 12px; background: #143a6b; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Демо-страница виджета</h1>
    <p>Так виджет выглядит на сайте. Кнопка в правом нижнем углу открывает квалификатор. Любую кнопку сайта можно связать с виджетом — ссылкой <code>#kvalificator</code> или атрибутом <code>data-kval-open</code>.</p>
    <a class="cta" href="#kvalificator">Обсудить проект</a>
  </main>
  <script src="/widget.js" defer></script>
</body>
</html>
